<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hackshtark</title>
<meta name="description" content="Hackshtark — get in touch.">
<link rel="icon" href="logo-hackshtark-no-bg.png">
<style>
  :root {
    --bg: #ffffff;
    --fg: #0a0a0a;
    --muted: #6b6b6b;
    --rule: rgba(10, 10, 10, 0.12);
    --logo-filter: none;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0a0a0a;
      --fg: #f5f5f5;
      --muted: #8a8a8a;
      --rule: rgba(245, 245, 245, 0.16);
      --logo-filter: invert(1);
    }
  }

  * { box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 6vmin 24px;
  }

  main {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: clamp(32px, 6vmin, 56px);
    animation: rise 0.7s cubic-bezier(0.22, 1, 0.36, 1) both;
  }

  .logo {
    width: min(420px, 74vw);
    height: auto;
    display: block;
    filter: var(--logo-filter);
  }

  .contact {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    font-size: clamp(15px, 1.6vw, 18px);
    letter-spacing: 0.01em;
    color: var(--fg);
    text-decoration: none;
    padding: 12px 22px;
    border: 1px solid var(--rule);
    border-radius: 999px;
    transition: border-color 0.25s ease, transform 0.25s ease, opacity 0.25s ease;
  }

  .contact:hover,
  .contact:focus-visible {
    border-color: var(--fg);
    transform: translateY(-1px);
  }

  .contact:focus-visible { outline: 2px solid var(--fg); outline-offset: 4px; }

  .contact svg {
    width: 17px;
    height: 17px;
    stroke: var(--muted);
    transition: stroke 0.25s ease;
  }

  .contact:hover svg { stroke: var(--fg); }

  @keyframes rise {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: none; }
  }

  @media (prefers-reduced-motion: reduce) {
    main { animation: none; }
    .contact { transition: none; }
  }
</style>
</head>
<body>
  <main>
    <img class="logo" src="logo-hackshtark-no-bg.png" alt="Hackshtark">
    <a class="contact" href="mailto:hackshtark@gmail.com">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="3" y="5" width="18" height="14" rx="2"></rect>
        <path d="m3 7 9 6 9-6"></path>
      </svg>
      hackshtark@gmail.com
    </a>
  </main>
</body>
</html>
