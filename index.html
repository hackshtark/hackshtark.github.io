<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hackshtark</title>
<meta name="description" content="Hackshtark — get in touch.">
<link rel="icon" href="logo-hackshtark-no-bg.png">
<style>
  :root {
    --bg: #05070b;
    --fg: #e8edf5;
    --muted: #8b95a8;
    --rule: rgba(180, 210, 255, 0.18);
    --accent: #3d7cff;
  }

  * { box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 6vmin 24px;
    overflow: hidden;
  }

  .bg {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    overflow: hidden;
    background:
      radial-gradient(ellipse 80% 60% at 50% 120%, rgba(30, 60, 120, 0.35), transparent 55%),
      linear-gradient(165deg, #05070b 0%, #0a1018 45%, #070b12 100%);
  }

  .bg::before,
  .bg::after {
    content: "";
    position: absolute;
    border-radius: 50%;
    filter: blur(80px);
    will-change: transform, opacity;
  }

  .bg::before {
    width: min(70vw, 640px);
    height: min(70vw, 640px);
    top: -12%;
    left: -8%;
    background: radial-gradient(circle, rgba(61, 124, 255, 0.45) 0%, rgba(61, 124, 255, 0) 70%);
    animation: pulse-a 4.5s ease-in-out infinite;
  }

  .bg::after {
    width: min(65vw, 560px);
    height: min(65vw, 560px);
    bottom: -18%;
    right: -10%;
    background: radial-gradient(circle, rgba(30, 200, 184, 0.28) 0%, rgba(30, 200, 184, 0) 70%);
    animation: pulse-b 5.5s ease-in-out infinite;
  }

  .bg-grid {
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(140, 180, 255, 0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(140, 180, 255, 0.04) 1px, transparent 1px);
    background-size: 64px 64px;
    mask-image: radial-gradient(ellipse 70% 60% at 50% 45%, black 20%, transparent 75%);
    opacity: 0.7;
  }

  .bg-glow {
    position: absolute;
    width: min(50vw, 420px);
    height: min(50vw, 420px);
    top: 42%;
    left: 50%;
    translate: -50% -50%;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(61, 124, 255, 0.22) 0%, transparent 68%);
    filter: blur(40px);
    animation: pulse-core 3.5s ease-in-out infinite;
  }

  main {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: clamp(32px, 6vmin, 56px);
    animation: rise 0.7s cubic-bezier(0.22, 1, 0.36, 1) both;
  }

  .logo {
    width: min(420px, 74vw);
    height: auto;
    display: block;
    filter: invert(1);
  }

  .contact {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    font-size: clamp(15px, 1.6vw, 18px);
    letter-spacing: 0.01em;
    color: var(--fg);
    text-decoration: none;
    padding: 12px 22px;
    border: 1px solid var(--rule);
    border-radius: 999px;
    background: rgba(8, 12, 20, 0.45);
    backdrop-filter: blur(8px);
    transition: border-color 0.25s ease, transform 0.25s ease, background 0.25s ease;
  }

  .contact:hover,
  .contact:focus-visible {
    border-color: rgba(180, 210, 255, 0.45);
    background: rgba(12, 20, 36, 0.65);
    transform: translateY(-1px);
  }

  .contact:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }

  .contact svg {
    width: 17px;
    height: 17px;
    stroke: var(--muted);
    transition: stroke 0.25s ease;
  }

  .contact:hover svg { stroke: var(--fg); }

  @keyframes rise {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: none; }
  }

  @keyframes pulse-a {
    0%, 100% { transform: translate(0, 0) scale(1); opacity: 0.55; }
    50%      { transform: translate(8%, 10%) scale(1.18); opacity: 0.9; }
  }

  @keyframes pulse-b {
    0%, 100% { transform: translate(0, 0) scale(1.05); opacity: 0.45; }
    50%      { transform: translate(-10%, -8%) scale(1.22); opacity: 0.8; }
  }

  @keyframes pulse-core {
    0%, 100% { transform: scale(0.92); opacity: 0.5; }
    50%      { transform: scale(1.12); opacity: 0.95; }
  }

  @media (prefers-reduced-motion: reduce) {
    main { animation: none; }
    .contact { transition: none; }
    .bg::before,
    .bg::after,
    .bg-glow { animation: none; }
  }
</style>
</head>
<body>
  <div class="bg" aria-hidden="true">
    <div class="bg-grid"></div>
    <div class="bg-glow"></div>
  </div>
  <main>
    <img class="logo" src="logo-hackshtark-no-bg.png" alt="Hackshtark">
    <a class="contact" href="mailto:hackshtark@gmail.com">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="3" y="5" width="18" height="14" rx="2"></rect>
        <path d="m3 7 9 6 9-6"></path>
      </svg>
      hackshtark@gmail.com
    </a>
  </main>
</body>
</html>
